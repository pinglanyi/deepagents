[project]
name = "deep-rag-example"
version = "0.1.0"
description = "Deep RAG agent example — progressive chunk retrieval via RAGFlow"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=1.0.2",
    "langchain-anthropic>=1.0.3",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
    "rich>=14.0.0",
    "deepagents>=0.2.6",
    "python-dotenv>=1.0.0",
    # langgraph-cli WITHOUT [inmem]: `langgraph dev` still uses in-memory SQLite
    # via langgraph_runtime_inmem. POSTGRES_URI has no effect under `langgraph dev`
    # because the Postgres runtime (langgraph_runtime_postgres) is closed-source and
    # only ships inside the LangGraph Platform Docker image. For persistent storage,
    # deploy to LangGraph Platform or use `uv run agent.py` (terminal mode).
    "langgraph-cli>=0.1.55",
    # Postgres driver required when POSTGRES_URI is set
    "psycopg[binary]>=3.1.0",
]

[tool.uv]
override-dependencies = [
    "nbconvert>=7.17.0",  # CVE-2025-53000
    "protobuf>=6.33.5",   # CVE-2026-0994
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rag_agent"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",
    "F",
    "I",
    "D",
    "D401",
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
